<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floating Auction</title>
<style>
:root{--bg1:#0f0c29;--bg2:#302b63;--card:rgba(255,255,255,.08);--text:#f5f5ff;--muted:#b9b6d9;--accent:#ff4fa3;--accent2:#7c5cff;--border:rgba(255,255,255,.18)}
[data-theme="light"]{--bg1:#fff1f7;--bg2:#e6e0ff;--card:rgba(255,255,255,.7);--text:#241f3d;--muted:#6a6590;--border:rgba(0,0,0,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed;display:flex;padding:20px;overflow-x:hidden;transition:.4s}
.bubble{position:fixed;bottom:-120px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--accent),var(--accent2));opacity:.25;animation:float linear infinite;pointer-events:none}
@keyframes float{to{transform:translateY(-120vh) translateX(40px) rotate(360deg)}}
.wrap{position:relative;z-index:1;width:100%;max-width:420px;margin:auto;display:flex;flex-direction:column;gap:20px;padding-bottom:70px}
.card{background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:24px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.main{animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
button.icon{background:none;border:1px solid var(--border);color:var(--text);border-radius:12px;padding:8px 10px;cursor:pointer;font-size:16px}
h1{margin:12px 0 4px;font-size:26px}h2{margin:0 0 12px;font-size:20px}
p{color:var(--muted);margin:0 0 16px}
.item{font-size:64px;text-align:center;animation:bob 3s ease-in-out infinite;margin:8px 0}
.price{text-align:center;font-size:14px;color:var(--muted)}
.price b{display:block;font-size:32px;color:var(--accent)}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:16px;outline:none}
input:focus{border-color:var(--accent)}
.go{width:100%;margin-top:20px;padding:14px;border:0;border-radius:14px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--accent),var(--accent2));cursor:pointer;transition:transform .15s}
.go:hover{transform:scale(1.03)}.go:disabled{opacity:.5;cursor:not-allowed}
#msg{margin-top:14px;text-align:center;font-size:14px;min-height:20px}
.ok{color:#3ddc97}.err{color:#ff6b6b}.wait{color:#ffc857}
/* leaderboard */
.lb{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;margin-top:8px;border:1px solid var(--border);animation:pop .4s both}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.lb .rk{width:28px;text-align:center;font-size:20px}
.lb .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.lb .am{font-weight:700;color:var(--accent)}
.lb.first{background:linear-gradient(90deg,rgba(255,79,163,.25),rgba(124,92,255,.25));font-size:18px;padding:16px 12px;box-shadow:0 0 24px rgba(255,79,163,.35)}
.lb small{color:var(--muted);font-weight:400}
/* admin */
#adminBtn{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:5;padding:10px 18px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);backdrop-filter:blur(10px);cursor:pointer;font-size:13px}
#panel{display:none;position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:20px}
#panel .box{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:20px;padding:22px;width:100%;max-width:420px;max-height:88vh;overflow:auto}
#panel input,#panel select{padding:9px;margin-top:6px;font-size:14px}
#panel button{width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:14px}
#panel small{display:block;margin-top:10px;color:var(--muted);text-align:center;min-height:16px}
#panel h4{margin:14px 0 4px}
.row{display:grid;grid-template-columns:1fr 80px 92px 34px;gap:4px;align-items:center;margin-top:6px;font-size:13px}
.row button{margin:0!important;padding:8px!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="card main">
    <div class="top">
      <span style="font-size:13px;color:var(--muted)">🔥 Live Auction</span>
      <div><button class="icon" id="snd">🔊</button> <button class="icon" id="thm">🌙</button></div>
    </div>
    <div class="item" id="iEmoji">🎁</div>
    <h1 id="iTitle">Mystery Prize</h1>
    <p id="iDesc">Enter your Instagram username and place your one bid.</p>
    <div class="price">Starting bid<b id="iPrice">Rs 200</b></div>
    <form onsubmit="return false">
      <label>Instagram username</label>
      <input id="u" placeholder="@yourname" autocomplete="off" maxlength="31">
      <label>Your bid (PKR)</label>
      <input id="a" type="number" min="200" step="10" placeholder="200">
      <button class="go" id="go">Place Bid</button>
    </form>
    <div id="msg"></div>
  </div>

  <div class="card">
    <h2>🏆 Leaderboard</h2>
    <div id="board">Loading…</div>
  </div>
</div>

<button id="adminBtn">🔑 Admin Code</button>
<div id="panel"><div class="box">
  <h3 style="margin:0 0 12px">Admin</h3>
  <div id="login"><input id="code" type="password" inputmode="numeric" placeholder="Enter admin code"><button id="enter">Unlock</button></div>
  <div id="tools" style="display:none">
    <h4>Edit page</h4>
    <input id="tEmoji" placeholder="Emoji"><input id="tTitle" placeholder="Title"><input id="tDesc" placeholder="Description"><input id="tMin" type="number" placeholder="Starting bid (PKR)">
    <button id="savePage">💾 Save page</button>
    <h4>Bids</h4>
    <div id="list"></div>
    <div class="row" style="grid-template-columns:1fr 90px"><input id="nU" placeholder="username"><input id="nA" type="number" placeholder="PKR"></div>
    <button id="addBid">➕ Add bid manually</button>
    <h4>Tools</h4>
    <button id="reset">♻️ Reset bid lock (this browser)</button>
    <button id="test">📨 Send test message to Discord</button>
  </div>
  <button id="close">Close</button>
  <small id="amsg"></small>
</div></div>

<script>
// ================= CONFIG =================
const WEBHOOK_URL = "https://discord.com/api/webhooks/1571148076826238976/P8rhFxa9wa8Mrqte85Sw2NgNkhImwPefe-U_Je8NubIeAxywOQ3XPxD3P0DkQyVAcaHD";
const ADMIN_CODE  = "2023";
// Optional: Cloudflare Worker URL that returns {"exists":true/false}
const VERIFY_URL  = "";
// Optional but needed for a SHARED leaderboard: Firebase Realtime Database URL,
// e.g. "https://your-project-default-rtdb.firebaseio.com"  (no trailing slash)
const DB_URL      = "https://bidi-a720e-default-rtdb.firebaseio.com";
// ==========================================

let MIN_BID = 200;
const $ = id => document.getElementById(id);
const msg = (t, c) => { $('msg').textContent = t; $('msg').className = c; };
const am = t => $('amsg').textContent = t;
const LS = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const SV = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const base = DB_URL.replace(/\/$/, '');

// ---------- Storage (Firebase if DB_URL set, else this browser only) ----------
const api = {
  async all() {
    if (base) { const o = (await (await fetch(base + '/bids.json')).json()) || {}; return Object.entries(o).map(([id, b]) => ({ id, ...b })); }
    return LS('bids', []);
  },
  async add(b) {
    if (base) await fetch(base + '/bids.json', { method: 'POST', body: JSON.stringify(b) });
    else { const l = LS('bids', []); l.push({ id: 'l' + Date.now(), ...b }); SV('bids', l); }
  },
  async set(id, p) {
    if (base) await fetch(`${base}/bids/${id}.json`, { method: 'PATCH', body: JSON.stringify(p) });
    else { const l = LS('bids', []), x = l.find(y => y.id === id); if (x) Object.assign(x, p); SV('bids', l); }
  },
  async del(id) {
    if (base) await fetch(`${base}/bids/${id}.json`, { method: 'DELETE' });
    else SV('bids', LS('bids', []).filter(y => y.id !== id));
  },
  async getCfg() { return base ? await (await fetch(base + '/cfg.json')).json() : LS('cfg', null); },
  async setCfg(c) { if (base) await fetch(base + '/cfg.json', { method: 'PUT', body: JSON.stringify(c) }); else SV('cfg', c); }
};

// ---------- Bubbles ----------
for (let i = 0; i < 18; i++) {
  const b = document.createElement('div'), s = 20 + Math.random() * 80;
  b.className = 'bubble';
  b.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}vw;animation-duration:${8+Math.random()*14}s;animation-delay:${-Math.random()*20}s`;
  document.body.appendChild(b);
}

// ---------- Sound ----------
let soundOn = true, ctx;
function beep(freqs, dur = .12, type = 'sine') {
  if (!soundOn) return;
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.15, ctx.currentTime + i * dur);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + (i + 1) * dur);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + i * dur); o.stop(ctx.currentTime + (i + 1) * dur);
    });
  } catch (e) {}
}
document.querySelectorAll('button,input').forEach(el => el.addEventListener('pointerdown', () => beep([600], .05)));

// ---------- Theme / sound toggles ----------
function setTheme(t) { document.documentElement.dataset.theme = t; $('thm').textContent = t === 'dark' ? '🌙' : '☀️'; SV('theme', t); }
setTheme(LS('theme', 'dark'));
$('thm').onclick = () => { setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); beep([500, 700]); };
$('snd').onclick = () => { soundOn = !soundOn; $('snd').textContent = soundOn ? '🔊' : '🔇'; beep([800]); };

// ---------- Page config ----------
let cfg = { emoji: '🎁', title: 'Mystery Prize', desc: 'Enter your Instagram username and place your one bid.', min: 200 };
function applyCfg() {
  $('iEmoji').textContent = cfg.emoji; $('iTitle').textContent = cfg.title; $('iDesc').textContent = cfg.desc;
  MIN_BID = +cfg.min || 200; $('iPrice').textContent = 'Rs ' + MIN_BID.toLocaleString();
  $('a').min = MIN_BID; $('a').placeholder = MIN_BID;
}
(async () => { try { const c = await api.getCfg(); if (c) cfg = c; } catch (e) {} applyCfg(); })();

// ---------- Leaderboard ----------
async function refreshBoard() {
  let bids;
  try { bids = await api.all(); } catch (e) { $('board').textContent = 'Could not load leaderboard.'; return; }
  bids = bids.filter(b => b.s !== 'rejected').sort((x, y) => y.a - x.a).slice(0, 10);
  const box = $('board'); box.textContent = '';
  if (!bids.length) { box.textContent = 'No bids yet. Be the first! 🚀'; return; }
  bids.forEach((b, i) => {
    const r = document.createElement('div'); r.className = 'lb' + (i === 0 ? ' first' : ''); r.style.animationDelay = i * .06 + 's';
    const rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = ['👑', '🥈', '🥉'][i] || (i + 1);
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = '@' + b.u;
    if (b.s === 'pending') { const sm = document.createElement('small'); sm.textContent = ' ⏳'; nm.appendChild(sm); }
    const amt = document.createElement('span'); amt.className = 'am'; amt.textContent = 'Rs ' + Number(b.a).toLocaleString();
    r.append(rk, nm, amt); box.appendChild(r);
  });
}
refreshBoard(); setInterval(refreshBoard, 15000);

// ---------- One bid per visitor ----------
function lock(text) { $('go').disabled = $('u').disabled = $('a').disabled = true; msg(text, 'wait'); }
if (LS('bidPlaced', false)) lock('You already placed your bid ⏳ Waiting for approval.');

// ---------- Place bid ----------
$('go').onclick = async () => {
  const user = $('u').value.trim().replace(/^@/, '');
  const amount = parseFloat($('a').value);
  const bad = t => { beep([200, 150], .15, 'square'); $('go').disabled = false; msg(t, 'err'); };
  if (!/^[A-Za-z0-9._]{1,30}$/.test(user)) return bad('Enter a valid Instagram username.');
  if (!(amount >= MIN_BID)) return bad(`Minimum bid is Rs ${MIN_BID.toLocaleString()}.`);

  $('go').disabled = true; msg('Checking Instagram username…', 'wait');
  let verified = '❔ Not checked';
  if (VERIFY_URL) {
    try {
      const j = await (await fetch(VERIFY_URL + '?u=' + encodeURIComponent(user))).json();
      if (!j.exists) return bad("That Instagram username doesn't exist.");
      verified = '✅ Verified exists';
    } catch (e) { return bad('Could not verify username. Try again.'); }
  }

  try {
    const all = await api.all();
    if (all.some(b => b.u.toLowerCase() === user.toLowerCase() && b.s !== 'rejected')) return bad('This username already placed a bid.');
  } catch (e) {}

  msg('Sending your bid…', 'wait');
  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        allowed_mentions: { parse: [] },
        embeds: [{ title: '🔔 New Bid — Approval Needed', color: 0xff4fa3, fields: [
          { name: 'Instagram', value: `https://instagram.com/${user}` },
          { name: 'Bid', value: `Rs ${amount.toLocaleString()} PKR`, inline: true },
          { name: 'Username check', value: verified, inline: true },
          { name: 'Time', value: new Date().toLocaleString(), inline: true }
        ] }]
      })
    });
    if (!res.ok) throw new Error('Discord replied ' + res.status);
    try { await api.add({ u: user, a: amount, s: 'pending', t: new Date().toLocaleString() }); } catch (e) {}
    SV('bidPlaced', true);
    beep([523, 659, 784, 1047], .12);
    lock('Bid sent! ✅ Waiting for approval.');
    refreshBoard();
  } catch (e) {
    $('go').disabled = false;
    bad('Could not send bid: ' + (e.message || 'network blocked') + '. Check your webhook URL.');
  }
};

// ---------- Admin ----------
$('adminBtn').onclick = () => { $('panel').style.display = 'flex'; $('login').style.display = ''; $('tools').style.display = 'none'; $('code').value = ''; am(''); beep([500]); };
$('close').onclick = () => $('panel').style.display = 'none';
$('enter').onclick = () => {
  if ($('code').value === ADMIN_CODE) { $('login').style.display = 'none'; $('tools').style.display = ''; am('Unlocked ✅'); fillEditor(); beep([523, 784]); }
  else { am('Wrong code ❌'); beep([200, 150], .15, 'square'); }
};
function fillEditor() { $('tEmoji').value = cfg.emoji; $('tTitle').value = cfg.title; $('tDesc').value = cfg.desc; $('tMin').value = cfg.min; renderBids(); }
async function renderBids() {
  const box = $('list'); box.textContent = '';
  let bids = []; try { bids = await api.all(); } catch (e) { box.textContent = 'Could not load bids.'; return; }
  if (!bids.length) { box.textContent = 'No bids yet.'; box.style.fontSize = '13px'; return; }
  bids.sort((x, y) => y.a - x.a).forEach(b => {
    const r = document.createElement('div'); r.className = 'row';
    const n = document.createElement('input'); n.value = '@' + b.u; n.onchange = async () => { await api.set(b.id, { u: n.value.replace(/^@/, '') }); refreshBoard(); };
    const a = document.createElement('input'); a.type = 'number'; a.value = b.a; a.onchange = async () => { await api.set(b.id, { a: +a.value }); refreshBoard(); };
    const st = document.createElement('select');
    ['pending', 'approved', 'rejected'].forEach(o => { const op = document.createElement('option'); op.value = op.textContent = o; if (o === b.s) op.selected = true; st.appendChild(op); });
    st.onchange = async () => { await api.set(b.id, { s: st.value }); refreshBoard(); };
    const d = document.createElement('button'); d.textContent = '🗑'; d.onclick = async () => { await api.del(b.id); renderBids(); refreshBoard(); };
    r.append(n, a, st, d); box.appendChild(r);
  });
}
$('savePage').onclick = async () => {
  cfg = { emoji: $('tEmoji').value || '🎁', title: $('tTitle').value || 'Auction', desc: $('tDesc').value, min: +$('tMin').value || 200 };
  try { await api.setCfg(cfg); applyCfg(); am('Page saved ✅'); beep([600, 800]); } catch (e) { am('Save failed ❌'); }
};
$('addBid').onclick = async () => {
  const u = $('nU').value.trim().replace(/^@/, ''), a = parseFloat($('nA').value);
  if (!u || !(a > 0)) return am('Enter username and amount');
  await api.add({ u, a, s: 'approved', t: new Date().toLocaleString() });
  $('nU').value = $('nA').value = ''; renderBids(); refreshBoard(); am('Bid added ✅');
};
$('reset').onclick = () => { SV('bidPlaced', false); $('go').disabled = $('u').disabled = $('a').disabled = false; msg('', ''); am('Bid lock reset ✅'); };
$('test').onclick = async () => {
  try {
    const r = await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content: '✅ Test message from your auction site' }) });
    am(r.ok ? 'Test sent ✅' : 'Discord replied ' + r.status);
  } catch (e) { am('Blocked before reaching Discord ❌'); }
};
</script>
</body>
</html>
